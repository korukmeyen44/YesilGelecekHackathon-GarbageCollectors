[platformio]
default_envs = uno_node_1, esp32_gateway
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24@1.4.11

[uno]
platform = atmelavr@5.1.0
board = uno
build_src_filter = +<node/>

[env:uno_node_1]
extends = uno
build_flags = -DGC_NODE_ID=1

[env:uno_node_2]
extends = uno
build_flags = -DGC_NODE_ID=2

[env:uno_node_3]
extends = uno
build_flags = -DGC_NODE_ID=3

[env:esp32_gateway]
platform = espressif32@6.9.0
board = esp32dev
build_src_filter = +<gateway/>
lib_deps =
    ${env.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@1.1.4

